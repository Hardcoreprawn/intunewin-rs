name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit --json > audit-results.json || true

      - name: Check audit results
        run: |
          if [ -f audit-results.json ]; then
            cat audit-results.json | jq .
            VULNS=$(cat audit-results.json | jq '.vulnerabilities.count')
            if [ "$VULNS" != "0" ] && [ "$VULNS" != "null" ]; then
              echo "::warning::Found $VULNS vulnerabilities"
            fi
          fi

  # SAST with clippy
  clippy-analysis:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --message-format=json > clippy-results.json || true

      - name: Display clippy results
        run: |
          echo "Clippy warnings and errors:"
          cat clippy-results.json | jq -r 'select(.message.level == "warning" or .message.level == "error") | .message.message' | head -20 || true

  # License check
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Check licenses
        run: cargo deny check licenses || true

      - name: Check advisories
        run: cargo deny check advisories || true
