name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.get_version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Extract content between this version header and the next
            CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release v${VERSION}"
            fi
          else
            CHANGELOG="Release v${VERSION}"
          fi
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: intunewin-rs v${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 intunewin-rs v${{ steps.get_version.outputs.version }}
            
            High-performance Rust implementation of Microsoft's IntuneWin packager.
            
            ### 📦 Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `intunewin-rs-x86_64-pc-windows-msvc.zip` |
            | Windows | ARM64 | `intunewin-rs-aarch64-pc-windows-msvc.zip` |
            | Linux | x86_64 | `intunewin-rs-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux | ARM64 | `intunewin-rs-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS | x86_64 | `intunewin-rs-x86_64-apple-darwin.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `intunewin-rs-aarch64-apple-darwin.tar.gz` |
            
            ### 📋 Changelog
            
            ${{ steps.changelog.outputs.content }}
            
            ### 🔧 Installation
            
            ```bash
            # Download and extract the appropriate archive for your platform
            # Add the binary to your PATH
            
            # Verify installation
            intunewin-rs --version
            ```
            
            ### 📊 Performance
            
            - **2.6x average speedup** over Microsoft's IntuneWinAppUtil
            - **87% memory reduction** for large packages
            - Cross-platform support (Windows, Linux, macOS)
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            ext: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            ext: .exe
          
          # Linux builds
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            ext: ""
            cross: true
          
          # macOS builds
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            ext: ""

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure cross-compilation (Linux ARM64)
        if: matrix.cross
        run: |
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $target = "${{ matrix.target }}"
          $archiveName = "intunewin-rs-$target"
          
          New-Item -ItemType Directory -Path $archiveName -Force
          Copy-Item "target/$target/release/intunewin-rs${{ matrix.ext }}" "$archiveName/"
          Copy-Item "README.md" "$archiveName/"
          Copy-Item "LICENSE" "$archiveName/" -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "$archiveName/*" -DestinationPath "$archiveName.zip"

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          version="${{ needs.create-release.outputs.version }}"
          target="${{ matrix.target }}"
          archive_name="intunewin-rs-$target"
          
          mkdir -p "$archive_name"
          cp "target/$target/release/intunewin-rs${{ matrix.ext }}" "$archive_name/"
          cp "README.md" "$archive_name/"
          cp "LICENSE" "$archive_name/" 2>/dev/null || true
          
          tar -czvf "$archive_name.tar.gz" "$archive_name"

      - name: Upload release asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./intunewin-rs-${{ matrix.target }}.zip
          asset_name: intunewin-rs-${{ matrix.target }}.zip
          asset_content_type: application/zip

      - name: Upload release asset (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./intunewin-rs-${{ matrix.target }}.tar.gz
          asset_name: intunewin-rs-${{ matrix.target }}.tar.gz
          asset_content_type: application/gzip

  # Update release with SHA256 checksums
  checksums:
    name: Generate Checksums
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }}
            });
            
            for (const asset of release.data.assets) {
              console.log(`Downloading ${asset.name}...`);
              const response = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: {
                  Accept: 'application/octet-stream'
                }
              });
              fs.writeFileSync(asset.name, Buffer.from(response.data));
            }

      - name: Generate SHA256 checksums
        run: |
          sha256sum intunewin-rs-*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./SHA256SUMS.txt
          asset_name: SHA256SUMS.txt
          asset_content_type: text/plain
