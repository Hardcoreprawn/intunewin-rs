[package]
name = "intunewin-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "High-performance Rust implementation of Microsoft's IntuneWin packager for Intune app deployment"
authors = ["IntuneWin-RS Contributors"]
license = "MIT"
repository = "https://github.com/hardcoreprawn/intunewin-rs"
homepage = "https://github.com/hardcoreprawn/intunewin-rs"
readme = "README.md"
keywords = ["intune", "microsoft", "packaging", "encryption", "windows"]
categories = ["command-line-utilities", "compression", "cryptography"]
exclude = [
    "testdata/*",
    "tests/*",
    "docs/*",
    ".github/*",
    "target/*",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rayon = "1.8"
memmap2 = "0.9"
walkdir = "2"
quick-xml = { version = "0.31", features = ["serialize"] }
indicatif = "0.18"
thiserror = "1"
anyhow = "1"
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1.3"
num_cpus = "1.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
